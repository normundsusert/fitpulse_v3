let state=null,cryptoKey=null,vaultSalt=null,saveQueue=Promise.resolve(),locking=false;
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x));}
function bytesToB64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out);}
function b64ToBytes(value){const raw=atob(value);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
async function deriveVaultKey(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptRecord(value,key,salt,format='fitpulse-encrypted-vault-v1'){const iv=crypto.getRandomValues(new Uint8Array(12));const plain=new TextEncoder().encode(JSON.stringify(value));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:VAULT_AAD},key,plain);return {format,kdf:'PBKDF2-SHA256',iterations:PBKDF2_ITERATIONS,cipher:'AES-256-GCM',salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(cipher))};}
async function decryptRecord(record,password){if(record?.format!=='fitpulse-encrypted-vault-v1'&&record?.format!=='fitpulse-encrypted-backup-v1')throw Error('Неверный формат зашифрованной копии');const salt=b64ToBytes(record.salt),iv=b64ToBytes(record.iv),cipher=b64ToBytes(record.data);const key=await deriveVaultKey(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:VAULT_AAD},key,cipher);return {value:JSON.parse(new TextDecoder().decode(plain)),key,salt};}
function legacyState(){let old=null;try{old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');}catch(e){}if(old&&typeof old==='object')return {...structuredCloneSafe(defaults),...old,timer:0,timerEnd:0,timerId:null};const migrated=structuredCloneSafe(defaults);try{const h=JSON.parse(localStorage.getItem('fp_history')||'[]'),m=JSON.parse(localStorage.getItem('fp_measurements')||'[]');if(Array.isArray(h))migrated.history=h.map(w=>({...w,exercises:(w.exercises||[]).map((e,i)=>({...e,id:(library.find(x=>x.name===e.name)||{}).id||('legacy-'+i)}))}));if(Array.isArray(m))migrated.measurements=m;}catch(e){}return migrated;}
function clearLegacy(){localStorage.removeItem(LEGACY_KEY);localStorage.removeItem('fp_history');localStorage.removeItem('fp_measurements');}
function persist(){if(!state||!cryptoKey||!vaultSalt)return Promise.resolve();const copy={...state,timer:0,timerEnd:0,timerId:null};saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(!cryptoKey||!vaultSalt)return;const record=await encryptRecord(copy,cryptoKey,vaultSalt);localStorage.setItem(VAULT_KEY,JSON.stringify(record));clearLegacy();}).catch(e=>{console.error('FitPulse encrypted save failed',e);toast('Не удалось зашифрованно сохранить данные. Проверь свободное место.');});return saveQueue;}
function renderGate(mode,message=''){document.body.classList.add('locked');document.getElementById('app').innerHTML=`<main class="gate-wrap"><form class="gate-card" id="vaultForm"><div class="gate-logo">F</div><div class="eyebrow">FITPULSE · ЗАЩИЩЁННЫЕ ДАННЫЕ</div><h1>${mode==='setup'?'Создай пароль':'Приложение заблокировано'}</h1><p>${mode==='setup'?'Пароль будет защищать все тренировки, замеры и ключ Gemini. Он не отправляется в интернет. Используй не менее 8 символов.':'Введи пароль, чтобы расшифровать данные на этом устройстве.'}</p><label class="field-label" for="vaultPassword">Пароль</label><input class="field" id="vaultPassword" type="password" minlength="8" autocomplete="${mode==='setup'?'new-password':'current-password'}" required placeholder="Минимум 8 символов">${mode==='setup'?'<label class="field-label" for="vaultConfirm">Повтори пароль</label><input class="field" id="vaultConfirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Повтори пароль">':''}<button class="btn btn-primary btn-block" type="submit">${mode==='setup'?'Создать защищённое хранилище':'Разблокировать FitPulse'}</button><div class="gate-error" id="vaultError" role="alert">${esc(message)}</div><div class="gate-foot">Данные зашифрованы AES-256-GCM. Если забудешь пароль, восстановить их без заранее сохранённой резервной копии невозможно. Для работы шифрования нужен HTTPS.</div></form></main>`;}
async function unlockOrSetup(event){event.preventDefault();const pass=document.getElementById('vaultPassword').value;const err=document.getElementById('vaultError');if(!window.crypto?.subtle){err.textContent='Шифрование недоступно. Открой FitPulse через HTTPS в современном браузере.';return;}try{if(localStorage.getItem(VAULT_KEY)){const record=JSON.parse(localStorage.getItem(VAULT_KEY));const opened=await decryptRecord(record,pass);cryptoKey=opened.key;vaultSalt=opened.salt;state={...structuredCloneSafe(defaults),...opened.value,timer:0,timerEnd:0,timerId:null};}else{if(pass.length<8){err.textContent='Пароль должен содержать минимум 8 символов.';return;}if(pass!==document.getElementById('vaultConfirm').value){err.textContent='Пароли не совпадают.';return;}vaultSalt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await deriveVaultKey(pass,vaultSalt);state=legacyState();const record=await encryptRecord(state,cryptoKey,vaultSalt);localStorage.setItem(VAULT_KEY,JSON.stringify(record));clearLegacy();}document.body.classList.remove('locked');render();}catch(e){cryptoKey=null;vaultSalt=null;state=null;err.textContent='Неверный пароль или повреждённое хранилище. Данные не изменены.';}}
async function lockApp(){if(!state||locking)return;locking=true;await persist();state=null;cryptoKey=null;vaultSalt=null;locking=false;renderGate('unlock');}
async function boot(){if(!window.crypto?.subtle){renderGate('setup','Для безопасного шифрования открой FitPulse через HTTPS.');return;}renderGate(localStorage.getItem(VAULT_KEY)?'unlock':'setup');if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:',err)));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function dateISO(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200);}
function daysSinceLast(){if(!state.history.length)return '—';const t=new Date(state.history[0].date+'T12:00:00');return Math.max(0,Math.floor((new Date()-t)/86400000))+' дн.';}
function oneRM(w,r){w=Number(w);r=Number(r);return w>0&&r>0?Math.round(w*(1+r/30)):0;}
function profileComplete(){const p=state.profile||{};return ['age','height','weight','goal','daysPerWeek','experience','sex','activity'].filter(k=>p[k]!==''&&p[k]!=null).length;}
function weekdayName(){return new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}
function trainingPlanStatus(){const p=state.profile||{},target=Number(p.daysPerWeek)||0;if(!target)return 'Сначала настроим твой план';const now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setDate(now.getDate()-day);start.setHours(0,0,0,0);const done=state.history.filter(w=>new Date(w.date+'T12:00:00')>=start).length;const left=Math.max(0,target-done);if(done>=target)return `План недели выполнен · ${done}/${target}`;return `На этой неделе ${done}/${target} · осталось ${left}`;}
function assistantBrief(){const p=state.profile||{};if(profileComplete()<8)return `Мне не хватает данных, чтобы точно вести прогрессию. Заполни профиль — возраст, рост, вес, пол, активность, цель, опыт и сколько тренировок в неделю ты планируешь.`;if(!state.history.length)return `Цель: ${p.goal}. Сегодня начнём с первой тренировки и создадим твою стартовую точку. После неё я буду сравнивать нагрузки и предлагать следующий шаг.`;const d=parseInt(daysSinceLast())||0;const score=workoutScore(state.history[0]);let next=d===0?'Сегодня уже есть сохранённая тренировка. Восстановись и не добавляй вторую тяжёлую сессию без необходимости.':d===1?'Прошёл 1 день после тренировки. Оцени восстановление перед новой нагрузкой.':`После последней тренировки прошло ${d} дн. Можно планировать следующую сессию по самочувствию.`;const nt=nutritionTargets();const food=nt?` Питание: ориентир ${nt.kcal} kcal и ${nt.protein} г белка.`:'';return `${next} Последняя оценка — ${score}/100. ${localCoachBrief()}${food}`;}

function adaptiveTarget(x){const prev=previousExercise(x.id);if(!prev)return {weight:x.group==='Ноги и плечи'?30:20,reps:x.reps,reason:'Стартовый ориентир — скорректируй по ощущениям.'};const sets=prev.sets||[];const avg=sets.length?sets.reduce((a,z)=>a+(Number(z.reps)||0),0)/sets.length:0;const avgRir=sets.length?sets.reduce((a,z)=>a+(Number(z.rir??2)),0)/sets.length:2;const weight=Math.max(...sets.map(z=>Number(z.weight)||0),20);const hit=avg>=x.reps&&avgRir>=1.5;const hard=avgRir<1||avg<x.reps-2;const step=x.group==='Ноги и плечи'?5:2.5;if(hit)return {weight:weight+step,reps:x.reps,reason:`Прошлая тренировка прошла уверенно. Пробуем +${step} кг.`};if(hard)return {weight:avgRir<1?weight:Math.max(0,weight-step),reps:x.reps,reason:'Прошлая тренировка далась тяжело. Вес не повышаем — цель: чистая техника.'};return {weight,reps:x.reps,reason:'Вес оставляем и сначала уверенно добираем целевые повторы.'};}
function priorBest1RM(id,excludeId){let best=0;for(const w of state.history){if(w.id===excludeId)continue;for(const e of w.exercises||[])if(e.id===id)for(const x of e.sets||[])best=Math.max(best,oneRM(x.weight,x.reps));}return best;}
function workoutScore(w){if(!w)return 0;let score=65;const sets=(w.exercises||[]).flatMap(e=>e.sets||[]);if(sets.length>=9)score+=8;if(sets.length>=14)score+=5;const valid=sets.filter(x=>Number(x.weight)>0&&Number(x.reps)>0).length;score+=Math.round((valid/Math.max(1,sets.length))*10);const rirs=sets.filter(x=>x.rir!=null).map(x=>Number(x.rir));if(rirs.length){const avg=rirs.reduce((a,b)=>a+b,0)/rirs.length;if(avg>=1&&avg<=3)score+=8;if(avg<.5)score-=8;}return Math.max(35,Math.min(98,score));}
function localCoachBrief(){if(!state.history.length)return 'Запиши первую тренировку — после неё FitPulse начнёт строить персональные цели по каждому упражнению.';const w=state.history[0],score=workoutScore(w),vol=Math.round(workoutVolume(w));let line=`Последняя тренировка: ${score}/100 · объём ${vol} кг. `;if(state.lastReport?.delta!=null)line+=`Динамика объёма ${state.lastReport.delta>0?'+':''}${state.lastReport.delta}%. `;line+=score>=82?'Нагрузка выглядит стабильной — повышай вес только там, где прошлые подходы были уверенными.':score<65?'Не гонись за прибавкой: сначала верни стабильные подходы и восстановление.':'Следующая цель — закрепить технику и постепенно добирать повторы.';return line;}
function sparkline(){const vals=state.history.slice(0,8).reverse().map(workoutVolume);if(vals.length<2)return '';const max=Math.max(...vals,1),min=Math.min(...vals,0),range=Math.max(1,max-min);const pts=vals.map((v,i)=>`${8+i*(284/(vals.length-1))},${66-(v-min)/range*52}`).join(' ');return `<svg class="spark" viewBox="0 0 300 76" preserveAspectRatio="none" aria-label="График тренировочного объёма"><polyline points="${pts}"/></svg>`;}
function haptic(ms=12){try{navigator.vibrate?.(ms)}catch(e){}}
function makeReport(workout){const prev=state.history.find(w=>w.id!==workout.id),vol=workoutVolume(workout),pv=workoutVolume(prev);const delta=pv?Math.round((vol-pv)/pv*100):null;let prs=[];for(const e of workout.exercises){const current=Math.max(0,...e.sets.map(x=>oneRM(x.weight,x.reps)));const old=priorBest1RM(e.id,workout.id);if(current>old&&old>0)prs.push(e.name);}const score=workoutScore(workout);return {volume:Math.round(vol),delta,score,prs:prs.slice(0,3),text:delta==null?'Первая сохранённая тренировка — стартовая точка для адаптивного тренера.':delta>8?'Объём заметно вырос. Не повышай всё сразу — добавляй нагрузку только в упражнениях, которые прошли уверенно.':delta<-12?'Объём ниже обычного. Следующую тренировку начни консервативно и оцени восстановление.':'Нагрузка стабильна. Закрепляй технику и постепенно добавляй повторения или вес.'};}
function progressSummary(){if(!state.history.length)return {volume:'—',change:'—',prs:0};const latest=workoutVolume(state.history[0]),prev=workoutVolume(state.history[1]);let prs=0;for(const x of library)if(best1RMFor(x.id)>0)prs++;return {volume:Math.round(latest),change:prev?Math.round((latest-prev)/prev*100)+'%':'—',prs};}
function nutritionTargets(){const p=state.profile||{},w=Number(p.weight),h=Number(p.height),a=Number(p.age);if(!w||!h||!a||!p.sex||!p.activity)return null;const base=10*w+6.25*h-5*a+(p.sex==='male'?5:-161);const mult={low:1.2,light:1.375,moderate:1.55,high:1.725}[p.activity]||1.375;let kcal=base*mult;const g=p.goal||'';if(g==='Снижение веса')kcal-=Math.min(650,Math.max(300,kcal*.18));if(g==='Набор мышц')kcal+=Math.min(350,Math.max(150,kcal*.08));kcal=Math.round(kcal/10)*10;let protein=Math.round(w*(g==='Набор мышц'||g==='Снижение веса'?1.8:1.6));let fat=Math.round(w*.8);let carbs=Math.max(80,Math.round((kcal-protein*4-fat*9)/4));return {kcal,protein,fat,carbs,fiber:Math.round(kcal/1000*14),water:Math.round(w*30/100)/10};}
function nutritionTotals(){return (state.nutritionLog||[]).filter(x=>x.date===dateISO()).reduce((a,x)=>({kcal:a.kcal+(+x.kcal||0),protein:a.protein+(+x.protein||0),fat:a.fat+(+x.fat||0),carbs:a.carbs+(+x.carbs||0)}),{kcal:0,protein:0,fat:0,carbs:0});}

h?(state.nutritionLog||[]).filter(x=>x.date===dateISO()).map(x=>`<div class="food-log"><div class="food-log-head"><b>${esc(x.name)}</b><b>${Math.round(x.kcal)} kcal</b></div><small>Б ${Math.round(x.protein)} · Ж ${Math.round(x.fat)} · У ${Math.round(x.carbs)} г</small></div>`).join(''):'<div class="empty">Пока ничего не записано. Опиши еду — ассистент оценит порцию и калорийность.</div>'}</div></section>`;}

function buildSession(){const chosen=state.category==='Все тело'?library:library.filter(x=>x.group===state.category);const lastFor=id=>{for(const w of state.history){const e=w.exercises.find(x=>x.id===id);if(e)return e;}return null;};
const caution=/боль|болит|голов|тошнит|температур|травм|давлен|головокруж/i.test(state.note);

function finish(){if(!state.session?.exercises?.length){toast('Добавь хотя бы одно упражнение');return;}const workout={id:Date.now(),date:dateISO(),durationMin:state.workoutStartedAt?Math.max(1,Math.round((Date.now()-state.workoutStartedAt)/60000)):null,category:state.session.category,exercises:state.session.exercises.map(e=>({...e,sets:e.sets.map(s=>({weight:Number(s.weight)||0,reps:Number(s.reps)||0,rir:Math.max(0,Math.min(5,Number(s.rir??2)))}))}))};state.history.unshift(workout);state.lastReport=makeReport(workout);state.session=null;state.workoutStartedAt=0;state.step='choose';state.tab='coach';stopTimer();persist();haptic([20,40,20]);render();toast('Готово · FitPulse обновил рекомендации');}
async function exportData(){await persist();const raw=localStorage.getItem(VAULT_KEY);if(!raw){toast('Не удалось создать резервную копию');return;}const record=JSON.parse(raw);record.format='fitpulse-encrypted-backup-v1';const blob=new Blob([JSON.stringify(record)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fitpulse-encrypted-backup-'+dateISO()+'.fitpulse.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Зашифрованная копия создана');}
function importData(file){const r=new FileReader();r.onload=async()=>{try{const record=JSON.parse(r.result);const backupPassword=prompt('Введи пароль, которым была защищена резервная копия:');if(backupPassword===null)return;const opened=await decryptRecord(record,backupPassword);if(!Array.isArray(opened.value.history)||!Array.isArray(opened.value.measurements))throw Error('Некорректные данные');state={...structuredCloneSafe(defaults),...opened.value,timer:0,timerEnd:0,timerId:null};await persist();render();toast('Зашифрованная копия восстановлена');}catch(e){toast('Не удалось открыть копию: проверь файл и пароль');}};r.readAsText(file);}

async function geminiRequest(prompt){
 const key=state.geminiKey;
 if(!key){toast('Сначала добавь Gemini API-ключ во вкладке «История»');state.tab='history';render();return null;}
 const model=state.geminiModel||'gemini-3.8-flash';
 const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
 const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:900,thinkingConfig:{thinkingLevel:'LOW'}}})});
 const data=await res.json();
 if(!res.ok)throw new Error(data?.error?.message||('HTTP '+res.status));
 const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\\n').trim();
 if(!text)throw new Error('Gemini не вернул текстовый ответ');
 return text;
}
async function askGemini(){
 const box=document.getElementById('aiAdvice');if(box)box.textContent='Gemini анализирует тренировку…';
 const session=state.session;if(!session)return;
 if(!confirm('Для анализа в Google Gemini будут отправлены сведения о текущей тренировке и самочувствии. Продолжить?')){if(box)box.textContent='Отправка отменена.';return;}
 const details=session.exercises.map(e=>e.name+': '+e.sets.map(s=>s.weight+' кг × '+s.reps).join(', ')).join('\\n');
 const prompt='Ты — осторожный фитнес-помощник, не врач. Дай краткие практичные рекомендации на русском. Не назначай лечение и не ставь диагнозы. Учитывай самочувствие и не поощряй тренировку через боль.\\nСамочувствие: '+state.note+'; энергия '+state.energy+'/10. Тренировка: '+session.category+'. Упражнения и подходы:\\n'+details+'\\nДай: 1) оценку объёма и интенсивности, 2) что улучшить в технике/порядке, 3) рекомендации по восстановлению. Не выдумывай данные.';
 try{state.aiAdvice=await geminiRequest(prompt);persist();render();}catch(e){state.aiAdvice='Ошибка Gemini: '+e.message;render();toast('Не удалось получить ответ Gemini');}
}
async function sendCoach(){const input=document.getElementById('coachInput');const q=input?.value.trim();if(!q)return;if(!state.geminiKey){toast('Сначала добавь Gemini API-ключ во вкладке «Прогресс»');state.tab='history';render();return;}if(!sessionStorage.getItem('fitpulse_ai_consent')){if(!confirm('Для ответа тренера в Google Gemini будут отправлены твой вопрос и выбранная история тренировок/замеров. Продолжить?'))return;sessionStorage.setItem('fitpulse_ai_consent','yes');}state.coachChat=state.coachChat||[];state.coachChat.push({role:'user',text:q});persist();render();const prompt='Ты — Твой тренер, персональный тренер в приложении. Отвечай по-русски, конкретно и коротко. Используй ТОЛЬКО переданные факты истории; не выдумывай веса или результаты. Цель — прогрессия нагрузки, техника, восстановление и следующая тренировка. Если данных мало — прямо скажи и задай один конкретный вопрос, который сильнее всего улучшит следующую рекомендацию. Учитывай профиль пользователя, но не выводи рабочие веса только из возраста, роста или массы тела. Не ставь диагнозы и не советуй тренироваться через боль. Если пользователь спрашивает следующую тренировку, дай конкретный план по упражнениям, весам/повторам только там, где история это позволяет, и объясни изменение. Контекст пользователя: '+coachContext()+'\nПоследние сообщения: '+JSON.stringify(state.coachChat.slice(-6))+'\nВопрос: '+q;try{const answer=await geminiRequest(prompt);state.coachChat.push({role:'assistant',text:answer});persist();render();}catch(e){state.coachChat.push({role:'assistant',text:'Не удалось получить ответ: '+e.message});persist();render();}}
async function analyzeFood(){const input=document.getElementById('foodInput'),text=input?.value.trim();if(!text)return;if(!state.geminiKey){toast('Для AI-оценки еды подключи Gemini во вкладке «Прогресс»');state.tab='history';render();return;}if(!confirm('Для оценки еды описание будет отправлено Google Gemini. Продолжить?'))return;state.nutritionAdvice='Оцениваю порцию…';render();try{const prompt=`Ты — помощник по питанию. Оцени указанную пользователем порцию. Не выдумывай точность: если количество не указано, дай разумную приблизительную оценку и отметь неопределённость. Верни СТРОГО одну строку JSON без markdown: {"name":"краткое название","kcal":число,"protein":число,"fat":число,"carbs":число,"note":"краткий комментарий"}. Все макросы в граммах. Еда: ${text}`;const raw=await geminiRequest(prompt);const obj=JSON.parse(raw.replace(/^```json\s*|\s*```$/g,''));if(!Number.isFinite(+obj.kcal))throw Error('Нет оценки калорий');const item={date:dateISO(),name:obj.name||text,kcal:+obj.kcal||0,protein:+obj.protein||0,fat:+obj.fat||0,carbs:+obj.carbs||0,note:obj.note||''};state.nutritionLog=state.nutritionLog||[];state.nutritionLog.unshift(item);const t=nutritionTargets(),sum={...nutritionTotals(),kcal:nutritionTotals().kcal+0};state.nutritionAdvice=`${obj.note||'Оценка приблизительная.'} Добавлено: ≈ ${Math.round(item.kcal)} kcal · Б ${Math.round(item.protein)} / Ж ${Math.round(item.fat)} / У ${Math.round(item.carbs)} г.`;persist();render();toast('Еда добавлена');}catch(e){state.nutritionAdvice='Не удалось оценить: '+e.message;render();}}
async function testGemini(){
 const status=document.getElementById('geminiStatus');const key=document.getElementById('geminiKey')?.value.trim();
 if(!key){if(status)status.textContent='Вставь API-ключ.';return;}
 state.geminiKey=key;state.geminiModel=document.getElementById('geminiModel')?.value||'gemini-3.8-flash';
 if(status)status.textContent='Проверяю подключение…';
 try{const answer=await geminiRequest('Ответь одним коротким предложением: подключение FitPulse работает.');if(status)status.textContent='Подключение успешно. Ответ: '+answer;persist();}
 catch(e){if(status)status.textContent='Ошибка: '+e.message;}
}

document.addEventListener('submit',e=>{if(e.target.id==='vaultForm')unlockOrSetup(e);});
document.addEventListener('input',e=>{if(e.target.id==='energy'){state.energy=Number(e.target.value);document.getElementById('energyVal').textContent=state.energy;}if(e.target.id==='wellness')state.note=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-field]')){const ex=state.session?.exercises[Number(t.dataset.i)],set=ex?.sets[Number(t.dataset.j)];if(!set)return;set[t.dataset.field]=Math.max(0,Number(t.value)||0);persist();} });
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}
if(b.dataset.category){state.category=b.dataset.category;render();return;}
const a=b.dataset.action;if(a==='quick-coach'){state.tab='coach';render();setTimeout(()=>{const q=document.getElementById('coachInput');if(q){q.value=b.dataset.q||'';q.focus();}},0);return;}haptic();const i=Number(b.dataset.i),j=Number(b.dataset.j),ex=state.session?.exercises[i];
switch(a){
case'lock':lockApp();break;
case'to-check':state.step='check';render();break;
case'back-choose':state.step='choose';render();break;
case'start':state.energy=Number(document.getElementById('energy').value);state.note=document.getElementById('wellness').value;if(/боль|болит|голов|тошнит|температур|травм|давлен|головокруж/i.test(state.note)){toast('При таких симптомах тренировку лучше пропустить');break;}buildSession();break;
case'timer':startTimer(Number(b.dataset.seconds)||90);render();break;
case'stop-timer':stopTimer();break;
case'add-set':if(ex){const last=ex.sets[ex.sets.length-1]||{weight:ex.targetWeight,reps:ex.targetReps};ex.sets.push({...last});persist();render();}break;
case'remove-set':if(ex&&ex.sets.length>1){ex.sets.splice(j,1);persist();render();}else toast('В упражнении должен остаться хотя бы один подход');break;
case'remove-exercise':if(ex){state.session.exercises.splice(i,1);persist();render();}break;
case'add-exercise':state.exercisePickerOpen=true;render();break;case'pick-exercise':{const x=library.find(z=>z.id===b.dataset.exercise);if(x&&state.session){const t=adaptiveTarget(x);state.session.exercises.push({id:x.id,name:x.name,targetWeight:t.weight,targetReps:t.reps,targetReason:t.reason,sets:Array.from({length:x.sets},()=>({weight:t.weight,reps:t.reps,rir:2}))});state.exercisePickerOpen=false;persist();render();}break;}case'profile-open':state.profileOpen=true;render();break;case'profile-goal':state.profile={...(state.profile||{}),goal:b.dataset.goal};render();break;case'profile-save':{state.profile={...(state.profile||{}),age:Number(document.getElementById('p-age')?.value)||'',height:Number(document.getElementById('p-height')?.value)||'',weight:Number(document.getElementById('p-weight')?.value)||'',targetWeight:Number(document.getElementById('p-target')?.value)||'',sex:document.getElementById('p-sex')?.value||'',activity:document.getElementById('p-activity')?.value||'',daysPerWeek:Number(document.getElementById('p-days')?.value)||'',experience:document.getElementById('p-experience')?.value||''};state.profileOpen=false;persist();render();toast('Профиль сохранён');break;}case'modal-close':state.profileOpen=false;state.exercisePickerOpen=false;render();break;
case'finish':if(confirm('Сохранить эту тренировку в историю?'))finish();break;
case'cancel':if(confirm('Отменить тренировку? Несохранённые подходы будут потеряны.')){state.session=null;state.step='choose';stopTimer();render();}break;
case'save-measure':{const keys=['weight','chest','waist','hips','biceps','shoulders'];const m={date:dateISO()};keys.forEach(k=>{const v=document.getElementById('m-'+k).value;if(v!=='')m[k]=Number(v);});if(Object.keys(m).length===1){toast('Заполни хотя бы одно значение');break;}state.measurements.unshift(m);if(m.weight)state.profile={...(state.profile||{}),weight:m.weight};persist();render();toast('Замеры сохранены');break;}
case'delete-history':if(confirm('Удалить эту запись из истории?')){state.history=state.history.filter(x=>String(x.id)!==b.dataset.id);persist();render();toast('Запись удалена');}break;
case'ask-gemini':askGemini();break;
case'coach-send':sendCoach();break;
case'food-analyze':analyzeFood();break;
case'save-gemini':state.geminiKey=document.getElementById('geminiKey')?.value.trim()||'';state.geminiModel=document.getElementById('geminiModel')?.value||'gemini-3.8-flash';persist();toast('Настройки Gemini сохранены на этом устройстве');break;
case'test-gemini':state.geminiKey=document.getElementById('geminiKey')?.value.trim()||'';state.geminiModel=document.getElementById('geminiModel')?.value||'gemini-3.8-flash';testGemini();break;
case'export':exportData();break;
case'import':document.getElementById('importFile').click();break;
}
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0]);});
window.addEventListener('pagehide',()=>{persist();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state)lockApp();});
boot();
})();
</script>
