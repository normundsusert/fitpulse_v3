<script>
(function(){

const VAULT_KEY='fitpulse_encrypted_v1'; // legacy password vault, migration only
const STORE_KEY='fitpulse_data_v4';
const LEGACY_KEY='fitpulse_data_v2';
const PBKDF2_ITERATIONS=310000;
const VAULT_AAD=new TextEncoder().encode('FitPulse encrypted local vault v1');
const defaults={
 tab:'workout',step:'choose',category:'Грудь и трицепс',energy:8,note:'',
 measurements:[],history:[],session:null,timer:0,timerEnd:0,timerId:null,geminiKey:'',geminiModel:'gemini-3.8-flash',aiAdvice:'',coachChat:[],lastReport:null,autoCoach:true,workoutStartedAt:0,profile:{age:'',height:'',weight:'',goal:'',daysPerWeek:'',experience:'',sex:'',activity:'',targetWeight:''},nutritionLog:[],nutritionAdvice:'',exercisePickerOpen:false,lastSetCoach:null

const library=[
 {id:'bench',tech:"Лопатки сведены и прижаты · стопы устойчиво на полу · опускай гриф под контролем к нижней части груди. Не отбивай гриф от груди.",name:'Жим штанги лёжа',group:'Грудь и трицепс',sets:3,reps:8},
 {id:'incline',tech:"Сохраняй лопатки сведёнными · локти не разводи строго в стороны · опускай гантели контролируемо до комфортной глубины.",name:'Жим гантелей на наклонной',group:'Грудь и трицепс',sets:3,reps:10},
 {id:'triceps',tech:"Локти держи возле корпуса · двигается в основном предплечье · полностью контролируй возврат веса, не раскачивай корпус.",name:'Разгибание на блоке',group:'Грудь и трицепс',sets:3,reps:12},
 {id:'pulldown',tech:"Сначала опусти плечи · тяни локти вниз к бокам · не отклоняй корпус сильно назад и не дёргай вес.",name:'Тяга верхнего блока',group:'Спина и бицепс',sets:3,reps:10},
 {id:'row',tech:"Грудь раскрыта · корпус стабилен · веди локти назад и своди лопатки, не превращая движение в раскачивание.",name:'Горизонтальная тяга',group:'Спина и бицепс',sets:3,reps:10},
 {id:'curl',tech:"Локти остаются возле корпуса · не помогай спиной · поднимай и опускай вес контролируемо.",name:'Сгибание рук на бицепс',group:'Спина и бицепс',sets:3,reps:12},
 {id:'squat',tech:"Стопы устойчиво · колени следуют направлению носков · сохраняй нейтральную спину и глубину, которую контролируешь без боли.",name:'Приседания',group:'Ноги и плечи',sets:3,reps:8},

 {id:'legcurl',tech:"Таз прижат к тренажёру · сгибай ноги без рывка · медленно возвращай вес, сохраняя напряжение задней поверхности бедра.",name:'Сгибание ног в тренажёре',group:'Ноги и плечи',sets:3,reps:12},
 {id:'deadbug',tech:"Поясница мягко прижата · двигай противоположные руку и ногу медленно · останови амплитуду, если поясница начинает отрываться.",name:'Dead bug / пресс',group:'Все тело',sets:3,reps:12},

 {id:'hammer',tech:"Запястья нейтральны · локти возле корпуса · не раскачивайся и не бросай гантели вниз.",name:'Молотковые сгибания',group:'Спина и бицепс',sets:3,reps:12},
 {id:'legpress',tech:"Таз и спина прижаты · колени идут по направлению носков · не блокируй колени резко в верхней точке.",name:'Жим ногами',group:'Ноги и плечи',sets:3,reps:10},
 {id:'rdl',tech:"Движение начинается отведения таза назад · спина нейтральна · вес идёт близко к ногам, остановись при потере контроля.",name:'Румынская тяга',group:'Ноги и плечи',sets:3,reps:8},
 {id:'legext',tech:"Таз прижат · разгибай колени плавно · не бросай вес вниз и не используй инерцию.",name:'Разгибание ног в тренажёре',group:'Ноги и плечи',sets:3,reps:12},
 {id:'lateralraise',tech:"Плечи не поднимай к ушам · локти мягкие · поднимай руки контролируемо без раскачивания корпуса.",name:'Махи гантелями в стороны',group:'Ноги и плечи',sets:3,reps:12},
 {id:'hipthrust',tech:"Подбородок слегка к груди · таз поднимай за счёт ягодиц · не переразгибай поясницу в верхней точке.",name:'Ягодичный мост / Hip Thrust',group:'Все тело',sets:3,reps:10},
 {id:'calf',tech:"Полная контролируемая амплитуда · пауза в верхней точке · опускай пятки медленно без пружины.",name:'Подъёмы на носки',group:'Все тело',sets:3,reps:15}
];
let state=null,saveQueue=Promise.resolve();
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x));}
function bytesToB64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out);}
function b64ToBytes(value){const raw=atob(value);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
async function deriveVaultKey(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function decryptRecord(record,password){if(record?.format!=='fitpulse-encrypted-vault-v1'&&record?.format!=='fitpulse-encrypted-backup-v1')throw Error('Неверный формат зашифрованной копии');const salt=b64ToBytes(record.salt),iv=b64ToBytes(record.iv),cipher=b64ToBytes(record.data);const key=await deriveVaultKey(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:VAULT_AAD},key,cipher);return {value:JSON.parse(new TextDecoder().decode(plain)),key,salt};}
function normalizeState(value){const base=structuredCloneSafe(defaults),v=value&&typeof value==='object'?value:{};return {...base,...v,profile:{...base.profile,...(v.profile||{})},measurements:Array.isArray(v.measurements)?v.measurements:[],history:Array.isArray(v.history)?v.history:[],nutritionLog:Array.isArray(v.nutritionLog)?v.nutritionLog:[],coachChat:Array.isArray(v.coachChat)?v.coachChat:[],timer:0,timerEnd:0,timerId:null,exercisePickerOpen:false,profileOpen:false};}
function legacyState(){let old=null;try{old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');}catch(e){}if(old&&typeof old==='object')return normalizeState(old);const migrated=structuredCloneSafe(defaults);try{const h=JSON.parse(localStorage.getItem('fp_history')||'[]'),m=JSON.parse(localStorage.getItem('fp_measurements')||'[]');if(Array.isArray(h))migrated.history=h.map(w=>({...w,exercises:(w.exercises||[]).map((e,i)=>({...e,id:(library.find(x=>x.name===e.name)||{}).id||('legacy-'+i)}))}));if(Array.isArray(m))migrated.measurements=m;}catch(e){}return normalizeState(migrated);}
function clearLegacy(){localStorage.removeItem(LEGACY_KEY);localStorage.removeItem('fp_history');localStorage.removeItem('fp_measurements');}
function persist(){if(!state)return Promise.resolve();const copy={...state,timer:0,timerEnd:0,timerId:null,exercisePickerOpen:false,profileOpen:false};saveQueue=saveQueue.catch(()=>{}).then(()=>{localStorage.setItem(STORE_KEY,JSON.stringify(copy));clearLegacy();}).catch(e=>{console.error('FitPulse save failed',e);toast('Не удалось сохранить данные. Проверь свободное место на устройстве.');});return saveQueue;}
function renderMigration(message=''){document.body.classList.add('locked');document.getElementById('app').innerHTML=`<main class="gate-wrap"><form class="gate-card" id="migrationForm"><div class="gate-logo">F</div><div class="eyebrow">FITPULSE · ОБНОВЛЕНИЕ</div><h1>Убираем пароль</h1><p>В старой версии данные были зашифрованы твоим паролем. Введи его один последний раз — FitPulse перенесёт историю, профиль и тренировки в новую версию. После этого пароль при запуске больше не потребуется.</p><label class="field-label" for="migrationPassword">Старый пароль</label><input class="field" id="migrationPassword" type="password" autocomplete="current-password" required placeholder="Пароль от старой версии"><button class="btn btn-primary btn-block" type="submit">Перенести данные</button><button class="btn btn-secondary btn-block" type="button" data-action="fresh-start">Начать заново без старых данных</button><div class="gate-error" id="migrationError" role="alert">${esc(message)}</div><div class="gate-foot">Пароль используется только для разового переноса старого хранилища и не сохраняется.</div></form></main>`;}
async function migrateOldVault(event){event.preventDefault();const pass=document.getElementById('migrationPassword')?.value||'',err=document.getElementById('migrationError');try{if(!window.crypto?.subtle)throw Error('Открой FitPulse через HTTPS в современном браузере.');const record=JSON.parse(localStorage.getItem(VAULT_KEY)||'null');const opened=await decryptRecord(record,pass);state=normalizeState(opened.value);await persist();localStorage.removeItem(VAULT_KEY);document.body.classList.remove('locked');render();toast('Данные перенесены · пароль больше не нужен');}catch(e){if(err)err.textContent='Не удалось открыть старые данные. Проверь пароль.';}}
async function boot(){if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:',err)));try{const raw=localStorage.getItem(STORE_KEY);if(raw){state=normalizeState(JSON.parse(raw));document.body.classList.remove('locked');render();return;}if(localStorage.getItem(VAULT_KEY)){renderMigration();return;}state=legacyState();await persist();document.body.classList.remove('locked');render();}catch(e){console.error('FitPulse boot failed',e);state=normalizeState(defaults);document.body.classList.remove('locked');render();toast('Хранилище было повреждено. Запущена чистая локальная версия.');}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){return new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'});}
function dateISO(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`;}
function fmtDateTime(iso,dateFallback=''){if(!iso)return fmtDate(dateFallback);try{return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return fmtDate(dateFallback);}}
function effortLabel(v){v=Number(v);if(v<0)return 'Боль / дискомфорт';return v>=4?'Легко':v>=2?'Нормально':v===1?'Тяжело':'Предел';}
function setsText(sets){return (sets||[]).map(x=>`${Number(x.weight)||0}×${Number(x.reps)||0}`).join(' · ');}
function previousWorkoutForCategory(category,excludeId=null){return state.history.find(w=>(!excludeId||String(w.id)!==String(excludeId))&&w.category===category)||null;}
function previousExerciseEntry(id){for(const w of state.history){const e=(w.exercises||[]).find(x=>x.id===id);if(e)return {workout:w,exercise:e};}return null;}
function previousResultHtml(id){const prev=previousExerciseEntry(id);if(!prev)return `<div class="previous-result"><b>Прошлый результат:</b> пока нет сохранённых данных по этому упражнению.</div>`;return `<div class="previous-result"><b>Прошлый раз · ${fmtDate(prev.workout.date)}</b><br>${esc(setsText(prev.exercise.sets))}</div>`;}
function awaitPersistAndRender(){persist().finally(()=>render());}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200);}
function daysSinceLast(){if(!state.history.length)return '—';const t=new Date(state.history[0].date+'T12:00:00');return Math.max(0,Math.floor((new Date()-t)/86400000))+' дн.';}
function oneRM(w,r){w=Number(w);r=Number(r);return w>0&&r>0?Math.round(w*(1+r/30)):0;}
function profileComplete(){const p=state.profile||{};return ['age','height','weight','goal','daysPerWeek','experience'].filter(k=>p[k]!==''&&p[k]!=null).length;}
function weekdayName(){return new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}
function trainingPlanStatus(){const p=state.profile||{},target=Number(p.daysPerWeek)||0;if(!target)return 'Сначала настроим твой план';const now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setDate(now.getDate()-day);start.setHours(0,0,0,0);const done=state.history.filter(w=>new Date(w.date+'T12:00:00')>=start).length;const left=Math.max(0,target-done);if(done>=target)return `План недели выполнен · ${done}/${target}`;return `На этой неделе ${done}/${target} · осталось ${left}`;}
function assistantBrief(){const p=state.profile||{};if(profileComplete()<6)return `Мне не хватает данных, чтобы точнее вести прогрессию. Заполни профиль — возраст, рост, вес, цель, опыт и сколько тренировок в неделю ты планируешь.`;if(!state.history.length)return `Цель: ${p.goal}. Сегодня начнём с первой тренировки и создадим твою стартовую точку. После неё я буду сравнивать нагрузки и предлагать следующий шаг.`;const d=parseInt(daysSinceLast())||0;const score=workoutScore(state.history[0]);let next=d===0?'Сегодня уже есть сохранённая тренировка. Восстановись и не добавляй вторую тяжёлую сессию без необходимости.':d===1?'Прошёл 1 день после тренировки. Оцени восстановление перед новой нагрузкой.':`После последней тренировки прошло ${d} дн. Можно планировать следующую сессию по самочувствию.`;const mg=macroGuidance();const food=mg?` Ориентир по цели: белок ${mg.proteinText}, углеводы ${mg.carbText}.`:'';return `${next} Последняя оценка — ${score}/100. ${localCoachBrief()}${food}`;}
function header(){return `<header class="top"><div class="brand"><div class="logo">F</div><div><div class="brand-name">FITPULSE</div><div class="brand-sub">Assistant</div></div></div><button class="btn btn-secondary btn-small" data-action="profile-open">Профиль</button></header>
<section class="assistant-shell"><div class="assistant-head"><div class="assistant-orb">✦</div><div class="assistant-copy"><b>Добро пожаловать</b><span>${weekdayName()}</span></div></div><div class="briefing"><strong>Сводка тренера.</strong> ${esc(assistantBrief())}</div><div class="plan-chip">● ${esc(trainingPlanStatus())}</div>${profileComplete()<6?`<div class="profile-progress"><i style="width:${Math.round(profileComplete()/6*100)}%"></i></div><button class="btn btn-primary btn-block" data-action="profile-open">Настроить профиль</button>`:''}</section>`;}
function chooseView(){const cats=[['Грудь и трицепс','Грудь · трицепс'],['Спина и бицепс','Спина · бицепс'],['Ноги и плечи','Ноги · плечи'],['Все тело','Полный комплекс']];
return `<section class="card"><div class="section-head"><div><div class="section-title">Выбери тренировку</div><div class="section-note">С чего сегодня начнём?</div></div><span class="tag">01 / 03</span></div><div class="grid">${cats.map(([c,s])=>`<button class="choice ${state.category===c?'active':''}" data-category="${esc(c)}"><strong>${esc(c)}</strong><small>${s}</small></button>`).join('')}</div><button class="btn btn-primary btn-block" data-action="to-check">Продолжить <span aria-hidden="true">→</span></button></section>

function checkView(){return `<section class="card"><div class="section-head"><div><div class="section-title">Как ты себя чувствуешь?</div><div class="section-note">${esc(state.category)}</div></div><span class="tag">02 / 03</span></div>

function activeView(){
if(!state.session)return chooseView();
const s=state.session;
const allSets=s.exercises.flatMap(e=>e.sets||[]),doneSets=allSets.filter(x=>x.done).length,totalSets=allSets.length;
const pct=totalSets?Math.round(doneSets/totalSets*100):0;
const current=findCurrentSet();
let timer=state.timer?`<div class="timer"><div><span>ОТДЫХ</span><div style="font-size:12px;color:var(--text);margin-top:4px">${esc(state.restLabel||'Восстановись перед следующим подходом')}</div></div><strong id="timerValue">${state.timer}</strong><div class="timer-actions"><button class="btn btn-secondary btn-small" data-action="add-time" data-seconds="30">+30</button><button class="btn btn-secondary btn-small" data-action="stop-timer">Стоп</button></div></div>`:'';
const companion=current?`<div class="workout-companion"><div class="companion-line"><div><b>Сейчас · ${esc(current.ex.name)}</b><span>Подход ${current.j+1} из ${current.ex.sets.length} · цель ${current.set.weight} кг × ${current.set.reps}</span></div><span>${doneSets}/${totalSets}</span></div><div class="session-progress"><i style="width:${pct}%"></i></div></div>`:`<div class="workout-companion"><div class="companion-line"><div><b>Все подходы отмечены</b><span>Проверь результаты и заверши тренировку.</span></div><span>${doneSets}/${totalSets}</span></div><div class="session-progress"><i style="width:100%"></i></div></div>`;
return `<section class="card"><div class="section-head"><div><div class="section-title">Твоя тренировка</div><div class="section-note">${esc(s.category)} · ${s.exercises.length} упражн. · ${doneSets}/${totalSets} подходов</div></div><span class="tag">ТРЕНИРОВКА</span></div>
${s.advice?`<div class="notice ${s.caution?'warn':''}">${esc(s.advice)}</div>`:''}${companion}${timer}<div class="workout-tip"><b>Как отмечать подход:</b> Легко = большой запас · Нормально = осталось примерно 2–3 повтора · Тяжело = около 1 повтора в запасе · Предел = повторов в запасе нет. Если появилась боль — выбирай «Боль / дискомфорт».</div>
${s.exercises.map((ex,i)=>{const lib=library.find(x=>x.id===ex.id)||{};const rest=baseRestSeconds(ex);return `<article class="exercise"><div class="exercise-top"><div><div class="exercise-name">${esc(ex.name)}</div><div class="exercise-meta">Цель: ${ex.targetWeight} кг × ${ex.targetReps} · 1RM ≈ ${oneRM(ex.targetWeight,ex.targetReps)} кг<br>${esc(ex.targetReason||'Адаптивная цель по истории тренировок.')}</div><div class="tech-tip"><b>Техника</b> · ${esc(lib.tech||'Выполняй движение контролируемо и без боли.')}</div>${previousResultHtml(ex.id)}</div><button class="icon-btn" data-action="remove-exercise" data-i="${i}" aria-label="Удалить упражнение">×</button></div>
<div class="rest-rec"><span><b>Отдых между подходами</b><br>${restHint(ex)}</span><button class="btn btn-secondary btn-small" data-action="timer" data-seconds="${rest}">▶ ${formatRest(rest)}</button></div>
<div class="set-head v3"><span>№</span><span>Вес</span><span>Повт.</span><span>Ощущение</span><span>✓</span></div>
${ex.sets.map((set,j)=>{const isCurrent=current&&current.i===i&&current.j===j;const locked=set.done||set.skipped;const rec=set.coach?`<div class="next-set-card ${set.rir<0?'warn':''}"><b>${set.rir<0?'Остановись':set.skipped?'Пропущено':'После подхода'}</b><br>${esc(set.coach)}</div>`:'';return `<div class="set-block ${set.done?'done':''} ${set.skipped?'done':''} ${isCurrent?'current':''}"><div class="set-row v5"><span class="set-num">${j+1}</span><input class="set-input" type="number" min="0" step="0.5" inputmode="decimal" aria-label="Вес подхода ${j+1}" data-field="weight" data-i="${i}" data-j="${j}" value="${esc(set.weight)}" ${locked?'disabled':''}><input class="set-input" type="number" min="0" step="1" inputmode="numeric" aria-label="Повторы подхода ${j+1}" data-field="reps" data-i="${i}" data-j="${j}" value="${esc(set.reps)}" ${locked?'disabled':''}><select class="set-input effort" aria-label="Как прошёл подход ${j+1}" data-field="rir" data-i="${i}" data-j="${j}" ${locked?'disabled':''}><option value="4" ${(set.rir??2)>=4?'selected':''}>Легко</option><option value="2" ${(set.rir??2)>=2&&(set.rir??2)<4?'selected':''}>Нормально</option><option value="1" ${(set.rir??2)==1?'selected':''}>Тяжело</option><option value="0" ${(set.rir??2)==0?'selected':''}>Предел</option><option value="-1" ${(set.rir??2)<0?'selected':''}>Боль / дискомфорт</option></select><button class="set-check ${set.done?'done':''}" data-action="complete-set" data-i="${i}" data-j="${j}" aria-label="${set.done?'Подход отмечен':set.skipped?'Подход пропущен':'Завершить подход'}" ${set.skipped?'disabled':''}>${set.done?'✓':set.skipped?'—':'○'}</button></div>${set.done?`<div class="set-feedback ${set.rir<0?'warn':''}">${set.rir<0?'⚠':'✓'} ${esc(effortLabel(set.rir))} · ${Number(set.weight)||0} кг × ${Number(set.reps)||0}</div>`:set.skipped?`<div class="set-feedback warn">— Подход пропущен</div>`:''}${rec}${!locked?`<div class="set-mini-actions"><button data-action="remove-set" data-i="${i}" data-j="${j}">удалить подход</button></div>`:''}</div>`;}).join('')}
<div class="exercise-actions"><button class="link-btn" data-action="add-set" data-i="${i}">＋ Добавить подход</button><span class="section-note">Отмечай ✓ после каждого подхода</span></div></article>`;}).join('')}
${macroCard()}
<section class="card" style="margin-top:12px"><div class="section-head"><div><div class="section-title">Совет тренера</div><div class="section-note">Разбор текущей тренировки и следующий шаг.</div></div><span class="tag">AI</span></div><div id="aiAdvice" class="section-note">Локальные подсказки работают после каждого подхода. Gemini можно использовать для общего разбора.</div><button class="btn btn-secondary btn-block" data-action="ask-gemini">Получить общий разбор</button></section>
<button class="btn btn-secondary btn-block" data-action="add-exercise">＋ Добавить упражнение</button>
<button class="btn btn-primary btn-block" data-action="finish">Завершить тренировку</button>
<button class="btn btn-danger btn-block" data-action="cancel">Отменить тренировку</button></section>`;
}
function bodyView(){const latest=state.measurements[0]||{};const fields=[['weight','Вес','кг','0.1'],['chest','Грудь','см','0.5'],['waist','Талия','см','0.5'],['hips','Бёдра','см','0.5'],['biceps','Бицепс','см','0.5'],['shoulders','Плечи','см','0.5']];
return `<section class="card"><div class="section-head"><div><div class="section-title">Замеры тела</div><div class="section-note">Добавляй новые значения, чтобы видеть изменения.</div></div><span class="tag">${state.measurements.length} записей</span></div><div class="measure-grid">${fields.map(([k,n,u,step])=>`<div class="measure"><label for="m-${k}">${n}</label><input id="m-${k}" type="number" min="0" step="${step}" inputmode="decimal" placeholder="—" value="${latest[k]??''}"><span class="unit">${u}</span></div>`).join('')}</div><button class="btn btn-primary btn-block" data-action="save-measure">Сохранить замеры</button></section>
<section class="card"><div class="section-title">История замеров</div>${state.measurements.length?state.measurements.slice(0,12).map(m=>`<div class="history-item"><div class="history-top"><b>${fmtDate(m.date)}</b><time>${m.weight?m.weight+' кг':''}</time></div><div class="history-detail">${[['Грудь',m.chest],['Талия',m.waist],['Бёдра',m.hips],['Бицепс',m.biceps],['Плечи',m.shoulders]].filter(x=>x[1]!=null&&x[1]!=='').map(x=>`${x[0]}: ${x[1]} см`).join(' · ')||'Другие замеры не заполнены'}</div></div>`).join(''):`<div class="empty"><b>Пока нет замеров</b>Заполни значения выше и сохрани первую запись.</div>`}</section>`;}
function workoutVolume(w){return (w?.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,x)=>b+(Number(x.weight)||0)*(Number(x.reps)||0),0),0);}
function best1RMFor(id){let best=0;for(const w of state.history)for(const e of w.exercises||[])if(e.id===id)for(const x of e.sets||[])best=Math.max(best,oneRM(x.weight,x.reps));return best;}
function previousExercise(id,skipWorkoutId=null){for(const w of state.history){if(skipWorkoutId&&w.id===skipWorkoutId)continue;const e=(w.exercises||[]).find(x=>x.id===id);if(e)return e;}return null;}
function adaptiveTarget(x){const prev=previousExercise(x.id);if(!prev)return {weight:x.group==='Ноги и плечи'?30:20,reps:x.reps,reason:'Стартовый ориентир — скорректируй по ощущениям.'};const sets=prev.sets||[];const avg=sets.length?sets.reduce((a,z)=>a+(Number(z.reps)||0),0)/sets.length:0;const avgRir=sets.length?sets.reduce((a,z)=>a+(Number(z.rir??2)),0)/sets.length:2;const weight=Math.max(...sets.map(z=>Number(z.weight)||0),20);const hit=avg>=x.reps&&avgRir>=1.5;const hard=avgRir<1||avg<x.reps-2;const step=x.group==='Ноги и плечи'?5:2.5;if(hit)return {weight:weight+step,reps:x.reps,reason:`Прошлая тренировка прошла уверенно. Пробуем +${step} кг.`};if(hard)return {weight:avgRir<1?weight:Math.max(0,weight-step),reps:x.reps,reason:'Прошлая тренировка далась тяжело. Вес не повышаем — цель: чистая техника.'};return {weight,reps:x.reps,reason:'Вес оставляем и сначала уверенно добираем целевые повторы.'};}
function priorBest1RM(id,excludeId){let best=0;for(const w of state.history){if(w.id===excludeId)continue;for(const e of w.exercises||[])if(e.id===id)for(const x of e.sets||[])best=Math.max(best,oneRM(x.weight,x.reps));}return best;}
function workoutScore(w){if(!w)return 0;let score=65;const sets=(w.exercises||[]).flatMap(e=>e.sets||[]);if(sets.length>=9)score+=8;if(sets.length>=14)score+=5;const valid=sets.filter(x=>Number(x.weight)>0&&Number(x.reps)>0).length;score+=Math.round((valid/Math.max(1,sets.length))*10);const rirs=sets.filter(x=>x.rir!=null&&Number(x.rir)>=0).map(x=>Number(x.rir));if(rirs.length){const avg=rirs.reduce((a,b)=>a+b,0)/rirs.length;if(avg>=1&&avg<=3)score+=8;if(avg<.5)score-=8;}if(sets.some(x=>Number(x.rir)<0))score-=12;return Math.max(35,Math.min(98,score));}
function localCoachBrief(){if(!state.history.length)return 'Запиши первую тренировку — после неё FitPulse начнёт строить персональные цели по каждому упражнению.';const w=state.history[0],score=workoutScore(w),vol=Math.round(workoutVolume(w));let line=`Последняя тренировка: ${score}/100 · объём ${vol} кг. `;if(state.lastReport?.delta!=null)line+=`Динамика объёма ${state.lastReport.delta>0?'+':''}${state.lastReport.delta}%. `;line+=score>=82?'Нагрузка выглядит стабильной — повышай вес только там, где прошлые подходы были уверенными.':score<65?'Не гонись за прибавкой: сначала верни стабильные подходы и восстановление.':'Следующая цель — закрепить технику и постепенно добирать повторы.';return line;}
function sparkline(){const vals=state.history.slice(0,8).reverse().map(workoutVolume);if(vals.length<2)return '';const max=Math.max(...vals,1),min=Math.min(...vals,0),range=Math.max(1,max-min);const pts=vals.map((v,i)=>`${8+i*(284/(vals.length-1))},${66-(v-min)/range*52}`).join(' ');return `<svg class="spark" viewBox="0 0 300 76" preserveAspectRatio="none" aria-label="График тренировочного объёма"><polyline points="${pts}"/></svg>`;}
function haptic(ms=12){try{navigator.vibrate?.(ms)}catch(e){}}
function makeReport(workout){const prev=state.history.find(w=>w.id!==workout.id),vol=workoutVolume(workout),pv=workoutVolume(prev);const delta=pv?Math.round((vol-pv)/pv*100):null;let prs=[];for(const e of workout.exercises){const current=Math.max(0,...e.sets.map(x=>oneRM(x.weight,x.reps)));const old=priorBest1RM(e.id,workout.id);if(current>old&&old>0)prs.push(e.name);}const score=workoutScore(workout);return {volume:Math.round(vol),delta,score,prs:prs.slice(0,3),text:delta==null?'Первая сохранённая тренировка — стартовая точка для адаптивного тренера.':delta>8?'Объём заметно вырос. Не повышай всё сразу — добавляй нагрузку только в упражнениях, которые прошли уверенно.':delta<-12?'Объём ниже обычного. Следующую тренировку начни консервативно и оцени восстановление.':'Нагрузка стабильна. Закрепляй технику и постепенно добавляй повторения или вес.'};}
function progressSummary(){if(!state.history.length)return {volume:'—',change:'—',prs:0};const latest=workoutVolume(state.history[0]),prev=workoutVolume(state.history[1]);let prs=0;for(const x of library)if(best1RMFor(x.id)>0)prs++;return {volume:Math.round(latest),change:prev?Math.round((latest-prev)/prev*100)+'%':'—',prs};}
function macroGuidance(goalOverride=null){const p=state.profile||{},w=Number(p.weight),goal=goalOverride||p.goal;if(!w||!goal)return null;const cfg={
'Снижение веса':{protein:[1.8,2.2],carbs:[2,3],note:'Держи белок высоким, а углеводы — вокруг тренировок. Дефицит лучше делать умеренным.'},
'Набор мышц':{protein:[1.6,2.0],carbs:[3,5],note:'Белок держи стабильно, а углеводы помогают тренировочному объёму и восстановлению.'},
'Сила':{protein:[1.6,2.0],carbs:[3,5],note:'Не урезай углеводы слишком сильно в дни тяжёлых тренировок.'},
'Форма и здоровье':{protein:[1.4,1.8],carbs:[2.5,4],note:'Ориентир гибкий: больше углеводов в активные дни, меньше — в спокойные.'}
}[goal]||{protein:[1.6,2.0],carbs:[2.5,4],note:'Используй диапазон как стартовый ориентир.'};const pr=cfg.protein.map(x=>Math.round(w*x)),cr=cfg.carbs.map(x=>Math.round(w*x));return {goal,protein:pr,carbs:cr,proteinText:`${pr[0]}–${pr[1]} г/сутки`,carbText:`${cr[0]}–${cr[1]} г/сутки`,note:cfg.note};}
function macroCard(){const p=state.profile||{},mg=macroGuidance();if(!mg)return `<section class="card" style="margin-top:12px"><div class="section-title">Ориентиры по цели</div><div class="section-note">Дневник питания не ведём. Укажи вес и цель в профиле — FitPulse покажет простой ориентир по белку и углеводам.</div><button class="btn btn-secondary btn-block" data-action="profile-open">Заполнить профиль</button></section>`;return `<section class="card" style="margin-top:12px"><div class="section-head"><div><div class="section-title">Ориентиры по цели</div><div class="section-note">${esc(mg.goal)} · без дневника питания</div></div><span class="tag">БЖУ</span></div><div class="goal-macros"><div class="goal-macro"><b>${esc(mg.proteinText)}</b><span>белок</span></div><div class="goal-macro"><b>${esc(mg.carbText)}</b><span>углеводы</span></div></div><div class="macro-note">${esc(mg.note)} Это общий спортивный ориентир, а не медицинское назначение.</div></section>`;}
function exerciseType(ex){return ['bench','squat','row','pulldown','press','onerow','legpress','rdl','hipthrust'].includes(ex.id)?'compound':'isolation';}
function baseRestSeconds(ex){return exerciseType(ex)==='compound'?120:75;}
function formatRest(sec){const m=Math.floor(sec/60),s=sec%60;return s?`${m}:${String(s).padStart(2,'0')}`:`${m} мин`;}
function restHint(ex){const base=baseRestSeconds(ex);return exerciseType(ex)==='compound'?`Обычно ${formatRest(base)}–3 мин. После тяжёлого подхода дай себе больше времени.`:`Обычно ${formatRest(base)}–2 мин. Начинай следующий, когда дыхание и техника готовы.`;}
function weightStepFor(ex){return ['squat','legpress','rdl','hipthrust'].includes(ex.id)?5:2.5;}
function findCurrentSet(){if(!state.session)return null;for(let i=0;i<state.session.exercises.length;i++){const ex=state.session.exercises[i];for(let j=0;j<ex.sets.length;j++)if(!ex.sets[j].done&&!ex.sets[j].skipped)return {i,j,ex,set:ex.sets[j]};}return null;}
function nextSetAdvice(ex,set){const rir=Number(set.rir??2),weight=Number(set.weight)||0,reps=Number(set.reps)||0,target=Number(ex.targetReps)||reps||1,step=weightStepFor(ex);if(rir<0)return {stop:true,rest:0,text:'Отметил боль/дискомфорт. Не продолжай это упражнение через боль. Остальные подходы этого упражнения будут пропущены. Остановись и оцени состояние; при выраженных или новых симптомах обратись за медицинской помощью.'};if(reps<=0||weight<0)return {rest:baseRestSeconds(ex),text:'Проверь вес и повторения: без них я не могу корректно предложить следующий подход.'};let nextWeight=weight,nextReps=target,reason='Оставь тот же вес и постарайся повторить подход с чистой техникой.';if(rir>=4&&reps>=target){nextWeight=weight+step;reason=`Подход был лёгким и целевые повторы выполнены. Можно осторожно попробовать +${step} кг.`;}else if(rir===2&&reps>=target){reason='Нагрузка попала в рабочую зону. Вес оставь тем же и повтори качественный подход.';}else if(rir===1){nextReps=Math.max(1,Math.min(target,reps));reason='Подход тяжёлый. Вес не повышай; цель — сохранить технику и примерно те же повторы.';}else if(rir===0){nextWeight=Math.max(0,weight-step);nextReps=Math.max(1,target-1);reason=`Подход был на пределе. Следующий лучше облегчить примерно на ${step} кг и не идти снова до отказа.`;}if(reps<target-2&&rir<=1){nextWeight=Math.max(0,weight-step);nextReps=Math.max(1,target-1);reason=`Повторы заметно ниже цели и подход тяжёлый. Снизь вес примерно на ${step} кг, чтобы вернуть контролируемую технику.`;}let rest=baseRestSeconds(ex);if(rir<=1)rest+=60;else if(rir>=4)rest=Math.max(60,rest-15);return {nextWeight,nextReps,rest,text:`${reason} Следующий ориентир: ${nextWeight} кг × ${nextReps}. Отдых ≈ ${formatRest(rest)}.`};}
function applyNextSetRecommendation(i,j){const ex=state.session?.exercises?.[i],set=ex?.sets?.[j];if(!ex||!set)return null;const advice=nextSetAdvice(ex,set);set.coach=advice.text;set.completedAt=new Date().toISOString();set.done=true;if(advice.stop){ex.sets.slice(j+1).forEach(x=>{x.skipped=true;x.coach='Пропущено после отметки боли/дискомфорта в предыдущем подходе.';});}const next=ex.sets[j+1];if(next&&!next.done&&!next.skipped&&!advice.stop){next.weight=advice.nextWeight;next.reps=advice.nextReps;next.autoSuggested=true;}state.lastSetCoach={exercise:ex.name,set:j+1,text:advice.text,at:new Date().toISOString()};return advice;}

function coachContext(){const recent=state.history.slice(0,6).map(w=>({date:w.date,category:w.category,volume:Math.round(workoutVolume(w)),exercises:w.exercises.map(e=>({name:e.name,sets:e.sets}))}));return JSON.stringify({profile:state.profile||{},energy:state.energy,wellness:state.note,recentWorkouts:recent,measurements:state.measurements.slice(0,3),macroGuidance:macroGuidance(),lastSetCoach:state.lastSetCoach});}

function render(){closeModals();const app=document.getElementById('app');let content=state.tab==='body'?bodyView():state.tab==='history'?historyView():state.tab==='coach'?coachView():state.step==='check'?checkView():activeView();app.innerHTML=header()+content;

function buildSession(){const chosen=state.category==='Все тело'?library:library.filter(x=>x.group===state.category);
const caution=/боль|болит|голов|тошнит|температур|травм|давлен|головокруж/i.test(state.note);
const low=state.energy<=4;
const advice=caution?'Есть жалоба на самочувствие. Безопаснее пропустить тренировку; при выраженных или новых симптомах обратись за медицинской помощью.':low?'Энергии мало: начни легко, сократи объём и не работай до отказа.':state.energy<=6?'Сегодня держи умеренную интенсивность и не доводи подходы до предела.':'Самочувствие отмечено. Начни с разминки и подбирай рабочий вес без отказных повторений.';
const exercises=chosen.map(x=>{const t=adaptiveTarget(x);return {id:x.id,name:x.name,targetWeight:t.weight,targetReps:t.reps,targetReason:t.reason,sets:Array.from({length:x.sets},()=>({weight:t.weight,reps:t.reps,rir:2,done:false,coach:''}))};});
state.session={category:state.category,exercises,advice,caution};state.workoutStartedAt=Date.now();state.step='active';persist();render();}
function startTimer(seconds,label=''){clearInterval(state.timerId);state.timerEnd=Date.now()+seconds*1000;state.timer=seconds;state.restLabel=label||state.restLabel||'Восстановись перед следующим подходом';tickTimer();state.timerId=setInterval(tickTimer,250);}
function tickTimer(){state.timer=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));const el=document.getElementById('timerValue');if(el)el.textContent=state.timer;if(!state.timer){clearInterval(state.timerId);state.timerId=null;toast('Время отдыха закончилось');const t=document.querySelector('.timer');if(t)t.remove();}}
function stopTimer(){clearInterval(state.timerId);state.timerId=null;state.timer=0;state.timerEnd=0;state.restLabel='';render();}
function finish(){if(!state.session?.exercises?.length){toast('Добавь хотя бы одно упражнение');return;}const completed=state.session.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>({weight:Number(s.weight)||0,reps:Number(s.reps)||0,rir:Math.max(-1,Math.min(5,Number(s.rir??2))),done:true,coach:s.coach||'',completedAt:s.completedAt||null}))})).filter(e=>e.sets.length);if(!completed.length){toast('Сначала отметь ✓ хотя бы один выполненный подход');return;}const workout={id:Date.now(),date:dateISO(),startedAt:state.workoutStartedAt?new Date(state.workoutStartedAt).toISOString():null,finishedAt:new Date().toISOString(),durationMin:state.workoutStartedAt?Math.max(1,Math.round((Date.now()-state.workoutStartedAt)/60000)):null,category:state.session.category,exercises:completed};state.history.unshift(workout);state.lastReport=makeReport(workout);state.session=null;state.workoutStartedAt=0;state.step='choose';state.tab='coach';stopTimer();persist();haptic([20,40,20]);render();toast('Готово · FitPulse обновил рекомендации');}
async function exportData(){await persist();const payload={format:'fitpulse-backup-v4',exportedAt:new Date().toISOString(),data:{...state,timer:0,timerEnd:0,timerId:null,exercisePickerOpen:false,profileOpen:false}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fitpulse-backup-'+dateISO()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия создана');}
function importData(file){const r=new FileReader();r.onload=async()=>{try{const record=JSON.parse(r.result);let value;if(record?.format==='fitpulse-backup-v4')value=record.data;else if(record?.format==='fitpulse-encrypted-backup-v1'||record?.format==='fitpulse-encrypted-vault-v1'){const backupPassword=prompt('Это резервная копия старой версии. Введи её пароль:');if(backupPassword===null)return;value=(await decryptRecord(record,backupPassword)).value;}else value=record;if(!Array.isArray(value?.history)||!Array.isArray(value?.measurements))throw Error('Некорректные данные');state=normalizeState(value);await persist();render();toast('Резервная копия восстановлена');}catch(e){console.error(e);toast('Не удалось открыть резервную копию');}};r.readAsText(file);}
async function askGemini(){

}
async function sendCoach(){const input=document.getElementById('coachInput');const q=input?.value.trim();if(!q)return;if(!state.geminiKey){toast('Сначала добавь Gemini API-ключ во вкладке «Прогресс»');state.tab='history';render();return;}if(!sessionStorage.getItem('fitpulse_ai_consent')){if(!confirm('Для ответа тренера в Google Gemini будут отправлены твой вопрос и выбранная история тренировок/замеров. Продолжить?'))return;sessionStorage.setItem('fitpulse_ai_consent','yes');}state.coachChat=state.coachChat||[];state.coachChat.push({role:'user',text:q});persist();render();const prompt='Ты — Твой тренер, персональный тренер в приложении. Отвечай по-русски, конкретно и коротко. Используй ТОЛЬКО переданные факты истории; не выдумывай веса или результаты. Цель — прогрессия нагрузки, техника, восстановление и следующая тренировка. Если данных мало — прямо скажи и задай один конкретный вопрос, который сильнее всего улучшит следующую рекомендацию. Учитывай профиль пользователя, но не выводи рабочие веса только из возраста, роста или массы тела. Не ставь диагнозы и не советуй тренироваться через боль. Если пользователь спрашивает следующую тренировку, дай конкретный план по упражнениям, весам/повторам только там, где история это позволяет, и объясни изменение. Контекст пользователя: '+coachContext()+'\nПоследние сообщения: '+JSON.stringify(state.coachChat.slice(-6))+'\nВопрос: '+q;try{const answer=await geminiRequest(prompt);state.coachChat.push({role:'assistant',text:answer});persist();render();}catch(e){state.coachChat.push({role:'assistant',text:'Не удалось получить ответ: '+e.message});persist();render();}}

case'timer':startTimer(Number(b.dataset.seconds)||90,'Рекомендованный отдых');render();break;
case'add-time':if(state.timer){state.timerEnd+=((Number(b.dataset.seconds)||30)*1000);tickTimer();render();}break;
case'complete-set':{if(!ex)break;const set=ex.sets[j];if(!set)break;if(set.done){toast('Этот подход уже отмечен');break;}const advice=applyNextSetRecommendation(i,j);persist();if(advice?.stop){stopTimer();haptic([60,40,60]);render();toast('Упражнение лучше остановить');}else{startTimer(advice?.rest||baseRestSeconds(ex),`После ${j+1}-го подхода · ${ex.name}`);haptic([18,35,18]);render();toast('Подход записан · следующий скорректирован');}break;}
case'stop-timer':stopTimer();break;
case'add-set':if(ex){const last=ex.sets[ex.sets.length-1]||{weight:ex.targetWeight,reps:ex.targetReps,rir:2};ex.sets.push({weight:Number(last.weight)||ex.targetWeight,reps:Number(last.reps)||ex.targetReps,rir:2,done:false,coach:''});persist();render();}break;
case'remove-set':if(ex&&ex.sets.length>1){ex.sets.splice(j,1);persist();render();}else toast('В упражнении должен остаться хотя бы один подход');break;
case'remove-exercise':if(ex){state.session.exercises.splice(i,1);persist();render();}break;
case'add-exercise':state.exercisePickerOpen=true;render();break;
case'pick-exercise':{const selectedId=String(b.dataset.exercise||''),x=library.find(z=>z.id===selectedId);if(!x||!state.session){toast('Не удалось выбрать упражнение');break;}if(state.session.exercises.some(z=>z.id===selectedId)){toast('Это упражнение уже есть в тренировке');break;}const t=adaptiveTarget(x);state.session.exercises.push({id:x.id,name:x.name,targetWeight:t.weight,targetReps:t.reps,targetReason:t.reason,sets:Array.from({length:x.sets},()=>({weight:t.weight,reps:t.reps,rir:2,done:false,coach:''}))});state.exercisePickerOpen=false;persist();render();toast('Добавлено: '+x.name);break;}
case'profile-open':state.profileOpen=true;render();break;
case'profile-goal':{state.profile={...(state.profile||{}),goal:b.dataset.goal};document.querySelectorAll('.goal-btn').forEach(x=>x.classList.toggle('active',x.dataset.goal===b.dataset.goal));break;}
case'profile-save':{const age=Number(document.getElementById('p-age')?.value),height=Number(document.getElementById('p-height')?.value),weight=Number(document.getElementById('p-weight')?.value),targetRaw=document.getElementById('p-target')?.value||'',days=Number(document.getElementById('p-days')?.value),experience=document.getElementById('p-experience')?.value||'',goal=state.profile?.goal||'';const missing=[];if(!(age>=14&&age<=100))missing.push('возраст');if(!(height>=120&&height<=230))missing.push('рост');if(!(weight>=30&&weight<=300))missing.push('вес');if(!(days>=1&&days<=7))missing.push('тренировок в неделю');if(!goal)missing.push('цель');if(!experience)missing.push('опыт');if(missing.length){const er=document.getElementById('profileError');if(er)er.textContent='Заполни: '+missing.join(', ')+'.';toast('Профиль заполнен не полностью');break;}state.profile={...(state.profile||{}),age,height,weight,targetWeight:targetRaw===''?'':Number(targetRaw),daysPerWeek:days,experience,goal};state.profileOpen=false;awaitPersistAndRender();toast('Профиль сохранён');break;}
case'modal-close':state.profileOpen=false;state.exercisePickerOpen=false;render();break;
case'fresh-start':if(confirm('Удалить старое зашифрованное хранилище и начать заново?')){localStorage.removeItem(VAULT_KEY);state=normalizeState(defaults);persist().then(()=>{document.body.classList.remove('locked');render();toast('Новая версия готова · без пароля');});}break;
case'finish':if(confirm('Сохранить эту тренировку в историю?'))finish();break;
case'cancel':if(confirm('Отменить тренировку? Несохранённые подходы будут потеряны.')){state.session=null;state.step='choose';stopTimer();render();}break;
case'save-measure':{const keys=['weight','chest','waist','hips','biceps','shoulders'];const m={date:dateISO()};keys.forEach(k=>{const v=document.getElementById('m-'+k).value;if(v!=='')m[k]=Number(v);});if(Object.keys(m).length===1){toast('Заполни хотя бы одно значение');break;}state.measurements.unshift(m);if(m.weight)state.profile={...(state.profile||{}),weight:m.weight};persist();render();toast('Замеры сохранены');break;}
case'delete-history':if(confirm('Удалить эту запись из истории?')){state.history=state.history.filter(x=>String(x.id)!==b.dataset.id);persist();render();toast('Запись удалена');}break;
case'ask-gemini':askGemini();break;
case'coach-send':sendCoach();break;
case'save-gemini':state.geminiKey=document.getElementById('geminiKey')?.value.trim()||'';state.geminiModel=document.getElementById('geminiModel')?.value||'gemini-3.8-flash';persist();toast('Настройки Gemini сохранены на этом устройстве');break;
case'test-gemini':state.geminiKey=document.getElementById('geminiKey')?.value.trim()||'';state.geminiModel=document.getElementById('geminiModel')?.value||'gemini-3.8-flash';testGemini();break;
case'export':exportData();break;
case'import':document.getElementById('importFile').click();break;
}
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0]);});
window.addEventListener('pagehide',()=>{persist();});
boot();
})();
</script>
</body>
</html>
